<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tree</title>

    <link rel="stylesheet" href="./colors.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./mobile.css">
</head>
<body>
    <header>
        <div class="container" id="themes-container">
            <div class="theme" id="button-theme-light" onclick="setTheme('light-theme')"></div>
            <div class="theme" id="button-theme-off-white" onclick="setTheme('off-white-theme')"></div>
            <div class="theme" id="button-theme-dark" onclick="setTheme('dark-theme')"></div>
        </div>

        <h1>George Júnior</h1>
        <p id="description">Programmer for 5 years and future Bachelor in History</p>
    </header>

    <main>
        <div class="container" id="links-container">
            <a href="https://georgejrdev.github.io/redirect?to=linkedin" target="_blank">
                <div class="link" id="link-linkedin"></div>
            </a>

            <a href="https://georgejrdev.github.io/redirect?to=github" target="_blank">
                <div class="link" id="link-github"></div>
            </a>

            <a href="https://georgejrdev.github.io/redirect?to=blog" target="_blank">
                <div class="link" id="link-blog"></div>
            </a>

            <a href="https://georgejrdev.github.io/redirect?to=lattes" target="_blank">
                <div class="link" id="link-lattes"></div>
            </a>
        </div>
    </main>
    
    <script src="./script.js"></script>
</body>
</html>
