<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link-Tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/info-container.css">
    <link rel="stylesheet" href="./css/language.css">
    <link rel="stylesheet" href="./css/font.css">
</head>
<body>
    <div id="container">
        <div id="language">
            <button id="ptbr" onclick="changeLanguage('ptbr')"></button>
            <button id="en" onclick="changeLanguage('en')"></button>
        </div>
        
        <div class="mid-container">
            <div id="portfolio" class="info-container squad">
                <div class="info-header">
                    <div id="img-portfolio" class="info-header-img"></div>
                    <p class="info-header-text">Portfolio</p>
                </div>

                <p class="font-small" id="about-portfolio"></p>
            </div>

            <div id="linkedin" class="info-container squad">
                <div class="info-header">
                    <div id="img-linkedin" class="info-header-img"></div>
                    <p class="info-header-text">LinkedIn</p>
                </div>

                <p class="font-small" id="about-linkedin"></p>
            </div>
        </div>

        <div id="youtube" class="info-container large">
            <div id="img-youtube" class="info-header-img img-large"></div>
            <p class="font-large" id="youtube-text"></p>
        </div>

        <div id="blog" class="info-container large">
            <div id="img-blog" class="info-header-img img-large"></div>
            <p class="font-large" id="blog-text"></p>
        </div>

        <div class="mid-container">
            <div id="vocabulary" class="info-container squad">
                <div class="info-header">
                    <div id="img-vocabulary" class="info-header-img"></div>
                    <p class="info-header-text">Vocabulary</p>
                </div>

                <p class="font-small" id="about-vocabulary"></p>
            </div>

            <div id="github" class="info-container squad">
                <div class="info-header">
                    <div id="img-github" class="info-header-img"></div>
                    <p class="info-header-text">Github</p>
                </div>

                <p class="font-small" id="about-github"></p>
            </div>
        </div>

    </div>

    <script src="./js/language.js"></script>
    <script src="./js/redirect.js"></script>
</body>
</html>
